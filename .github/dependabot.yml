version: 2
updates:
  # New conformance cases arrive as a pull request moving the vectors submodule on; CI shows
  # whether the library still passes them.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The package supports Node 20: vitest 5 needs Node 22.12 or later, and the Node types
      # stay at the oldest supported Node.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
